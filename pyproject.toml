[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-desk"
version = "0.5.0"
description = "Insight Desk clean-room acquisition, semantic contracts, and zero-cost provider boundaries"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
acquisition = [
  "trafilatura==2.2.0",
]
browser = [
  "playwright==1.62.0",
]
semantic-local = [
  "kiwipiepy==0.23.2",
  "pecab==1.0.8",
  "RapidFuzz==3.14.5",
]
qa = [
  "hypothesis==6.165.2",
]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
  "mypy==1.17.1",
]

[tool.setuptools]
packages = [
  "insight_desk",
  "insight_desk.api",
  "insight_desk.core",
  "insight_desk.providers",
  "insight_desk.acquisition",
  "insight_desk.semantic",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["insight_desk"]
