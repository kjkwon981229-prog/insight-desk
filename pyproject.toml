[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-desk"
version = "0.2.0"
description = "Insight Desk API connectivity and preserved product infrastructure"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
  "mypy==1.17.1",
]

[tool.setuptools]
packages = ["insight_desk", "insight_desk.api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["insight_desk"]
