name: Phase 6 Zero-Cost Semantic Tools Canary

on:
  pull_request:
    branches:
      - phase4-core-contracts
    paths:
      - 'scripts/phase6_zero_cost_semantic_tools_canary.py'
      - '.github/workflows/phase6-zero-cost-semantic-tools-canary.yml'

permissions:
  contents: read

jobs:
  bounded-zero-cost-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install audited local-only tools
        run: |
          python -m pip install --disable-pip-version-check \
            kiwipiepy==0.23.2 \
            dateparser==1.4.1 \
            RapidFuzz==3.14.5

      - name: Run bounded semantic tools canary
        env:
          PYTHONPATH: .
        run: python scripts/phase6_zero_cost_semantic_tools_canary.py
