name: Phase 12 Verifier Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase12-verifier-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout verifier candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install verifier runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1

      - name: Probe zero-cost providers without logging source text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from insight_desk.core import CandidateEvent, EvidenceField, EvidenceSpan, EventFact
          from insight_desk.generation import GenerationRequest, Groq20BBriefingGenerator
          from insight_desk.providers.cloudflare import CloudflareClaimVerifier
          from insight_desk.providers.groq import GROQ_20B, GroqFreeClient
          from insight_desk.providers.local_nli import LocalNliVerifier
          from insight_desk.providers.transport import ProviderTransportError

          evidence = "테스트 기업은 2026년 8월 23일 인공지능 기반 신제품을 국내 시장에 정식 출시했다고 밝혔다."
          positive = evidence
          negative = "테스트 기업은 신제품 출시를 취소했다."
          evidence_ids = ("probe:evidence",)

          cloudflare = CloudflareClaimVerifier.from_env()
          local = LocalNliVerifier.transformers_default()

          def run_verifier(verifier, prefix):
              out = {}
              for label, claim in (("positive", positive), ("negative", negative)):
                  check = verifier.verify(
                      check_id=f"probe:{prefix}:{label}",
                      claim_text=claim,
                      evidence_text=evidence,
                      evidence_ids=evidence_ids,
                  )
                  out[label] = {
                      "entailed": check.entailed,
                      "error_code": check.error_code,
                  }
              return out

          span = EvidenceSpan(
              evidence_id=evidence_ids[0],
              article_id="probe:article",
              field=EvidenceField.BODY,
              start=0,
              end=len(evidence),
              text=evidence,
          )
          fact = EventFact(
              fact_id="probe:fact",
              subject="테스트 기업",
              action="인공지능 기반 신제품을 국내 시장에 정식 출시했다고 밝혔다",
              object="인공지능 기반 신제품",
              event_date="2026년 8월 23일",
              evidence_ids=evidence_ids,
          )
          event = CandidateEvent(
              event_id="probe:event",
              topic_id="ai_tech",
              fact_ids=(fact.fact_id,),
              article_ids=(span.article_id,),
          )
          request = GenerationRequest(
              event=event,
              facts={fact.fact_id: fact},
              evidence={span.evidence_id: span},
          )
          generator = Groq20BBriefingGenerator(GroqFreeClient.from_env(GROQ_20B))
          burst = []
          for sequence in range(1, 7):
              item = {
                  "sequence": sequence,
                  "ok": False,
                  "failure_kind": None,
                  "status_code": None,
                  "error_type": None,
              }
              try:
                  draft = generator.generate(request)
                  item["ok"] = bool(draft.headline and draft.summary)
              except ProviderTransportError as exc:
                  item["failure_kind"] = exc.failure_kind.value
                  item["status_code"] = exc.status_code
                  item["error_type"] = type(exc).__name__
              except Exception as exc:
                  item["error_type"] = type(exc).__name__
              burst.append(item)

          result = {
              "cloudflare": run_verifier(cloudflare, "cloudflare"),
              "local_nli": run_verifier(local, "local"),
              "groq_20b_production_burst": burst,
          }
          Path("build").mkdir(exist_ok=True)
          Path("build/verifier-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Upload verifier probe
        uses: actions/upload-artifact@v4
        with:
          name: phase12-verifier-probe-${{ github.run_id }}
          path: build/verifier-probe.json
          if-no-files-found: error
          retention-days: 1
