name: Phase 12 Verifier Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase12-verifier-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout verifier candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install verifier runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1

      - name: Probe zero-cost providers without logging source text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from insight_desk.core import FailureKind
          from insight_desk.providers.cloudflare import CloudflareClaimVerifier
          from insight_desk.providers.groq import GROQ_20B, GroqFreeClient
          from insight_desk.providers.local_nli import LocalNliVerifier
          from insight_desk.providers.transport import ProviderTransportError

          evidence = "테스트 기업은 2026년 8월 23일 신제품을 출시했다."
          positive = evidence
          negative = "테스트 기업은 신제품 출시를 취소했다."
          evidence_ids = ("probe:evidence",)

          cloudflare = CloudflareClaimVerifier.from_env()
          local = LocalNliVerifier.transformers_default()

          def run_verifier(verifier, prefix):
              out = {}
              for label, claim in (("positive", positive), ("negative", negative)):
                  check = verifier.verify(
                      check_id=f"probe:{prefix}:{label}",
                      claim_text=claim,
                      evidence_text=evidence,
                      evidence_ids=evidence_ids,
                  )
                  out[label] = {
                      "entailed": check.entailed,
                      "error_code": check.error_code,
                  }
              return out

          groq_result = {"ok": False, "failure_kind": None, "status_code": None, "error_type": None}
          try:
              groq = GroqFreeClient.from_env(GROQ_20B, delay_seconds=0)
              payload = groq.structured_json(
                  prompt="Return the literal string ok in the field value.",
                  schema={
                      "type": "object",
                      "properties": {"value": {"type": "string"}},
                      "required": ["value"],
                      "additionalProperties": False,
                  },
                  schema_name="phase12_provider_probe",
              )
              groq_result["ok"] = isinstance(payload.get("value"), str)
          except ProviderTransportError as exc:
              groq_result["failure_kind"] = exc.failure_kind.value
              groq_result["status_code"] = exc.status_code
              groq_result["error_type"] = type(exc).__name__
          except Exception as exc:
              groq_result["error_type"] = type(exc).__name__

          result = {
              "cloudflare": run_verifier(cloudflare, "cloudflare"),
              "local_nli": run_verifier(local, "local"),
              "groq_20b": groq_result,
          }
          Path("build").mkdir(exist_ok=True)
          Path("build/verifier-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Upload verifier probe
        uses: actions/upload-artifact@v4
        with:
          name: phase12-verifier-probe-${{ github.run_id }}
          path: build/verifier-probe.json
          if-no-files-found: error
          retention-days: 1
