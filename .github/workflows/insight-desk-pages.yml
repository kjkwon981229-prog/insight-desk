name: Insight Desk Daily Pages

on:
  workflow_dispatch:
  schedule:
    # 07:30 Asia/Seoul = 22:30 UTC on the previous day.
    - cron: "30 22 * * *"

concurrency:
  group: insight-desk-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      status: ${{ steps.state.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Mask API values in logs
        shell: bash
        run: |
          echo "::add-mask::$NCP_CLIENT_ID"
          echo "::add-mask::$NCP_CLIENT_SECRET"
          echo "::add-mask::$OPENDART_API_KEY"
          echo "::add-mask::$KOSIS_API_KEY"
      - name: Restore previous static site archive
        uses: actions/cache/restore@v4
        with:
          path: |
            build/site
            build/history
          key: insight-desk-site-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            insight-desk-site-${{ github.ref_name }}-
      - name: Build live briefing
        run: >-
          python -m insight_desk.cli
          --config config/topics.json
          --output build/site
          --state-file build/run-state.json
          --cache .cache/responses.json
      - name: Read run state
        id: state
        shell: bash
        run: |
          if [ ! -f build/run-state.json ]; then
            echo "status=TOTAL_FAILURE" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("build/run-state.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"status={state.get('status', 'TOTAL_FAILURE')}\n")
              output.write(f"publish={'true' if state.get('publish') is True else 'false'}\n")
          PY
      - name: Fail closed on total failure
        if: steps.state.outputs.status == 'TOTAL_FAILURE'
        run: |
          echo "::error::Both Naver collection paths failed; preserving the existing Pages site."
          exit 1
      - name: Validate Pages artifact
        if: steps.state.outputs.publish == 'true'
        run: python scripts/validate_artifact.py build/site
      - name: Validate live editorial acceptance
        if: steps.state.outputs.publish == 'true'
        run: python scripts/validate_live_acceptance.py build/live-acceptance.json
      - name: Upload selection audit
        if: always() && hashFiles('build/selection-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: selection-audit-${{ github.run_id }}
          path: |
            build/selection-audit.json
            build/live-acceptance.json
          if-no-files-found: error
      - name: Upload Pages artifact
        if: steps.state.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Save successful site archive
        if: steps.state.outputs.publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/site
            build/history
          key: insight-desk-site-${{ github.ref_name }}-${{ github.run_id }}

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  push_notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      BUILD_PUBLISH: ${{ needs.build.outputs.publish }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
      PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
    steps:
      - name: Mask push token
        shell: bash
        run: echo "::add-mask::$PUSH_SEND_TOKEN"
      - name: Send briefing state notification
        shell: bash
        run: |
          set -u
          if [[ -z "$PUSH_WORKER_URL" || -z "$PUSH_SEND_TOKEN" ]]; then
            echo "::warning::Push notification skipped because Worker configuration is incomplete."
            exit 0
          fi
          case "$PUSH_WORKER_URL" in
            https://*) ;;
            *)
              echo "::warning::Push notification skipped because PUSH_WORKER_URL is not HTTPS."
              exit 0
              ;;
          esac

          notification_type="FAILURE"
          if [[ "$BUILD_RESULT" == "success" && "$BUILD_PUBLISH" == "true" && "$DEPLOY_RESULT" == "success" ]]; then
            notification_type="READY"
          fi
          notification_source="other"
          case "$GITHUB_EVENT_NAME" in
            schedule) notification_source="schedule" ;;
            workflow_dispatch) notification_source="manual" ;;
          esac
          briefing_date="$(TZ=Asia/Seoul date +%F)"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(printf '{"date":"%s","run_id":"%s","type":"%s","source":"%s"}' "$briefing_date" "$run_id" "$notification_type" "$notification_source")"
          response_file="${RUNNER_TEMP}/insight-desk-push-response.json"
          http_status="$(curl --silent --show-error --max-time 20 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -X POST "${PUSH_WORKER_URL%/}/send" \
            -H "Authorization: Bearer $PUSH_SEND_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" || true)"

          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::Push endpoint did not accept the notification (type=$notification_type; http=$http_status)."
            exit 0
          fi
          if ! jq -e '(.request_state == "REQUEST_ACCEPTED") and (.duplicate | type == "boolean") and (.delivery_state | IN("DELIVERED", "NO_SUBSCRIBERS", "PARTIAL_DELIVERY", "ALL_DELIVERIES_FAILED", "STALE_SUBSCRIPTIONS_PRUNED")) and (.sent | type == "number") and (.failed | type == "number") and (.pruned | type == "number") and (.subscription_count | type == "number")' "$response_file" >/dev/null 2>&1; then
            echo "::warning::Push endpoint returned an invalid response (type=$notification_type; http=$http_status)."
            exit 0
          fi
          delivery_state="$(jq -r '.delivery_state' "$response_file")"
          sent="$(jq -r '.sent' "$response_file")"
          failed="$(jq -r '.failed' "$response_file")"
          pruned="$(jq -r '.pruned' "$response_file")"
          if [[ "$delivery_state" == "ALL_DELIVERIES_FAILED" || "$delivery_state" == "PARTIAL_DELIVERY" ]]; then
            echo "::warning::Push delivery was not complete (type=$notification_type; source=$notification_source; state=$delivery_state; sent=$sent; failed=$failed; pruned=$pruned)."
            exit 0
          fi
          echo "Push delivery state (type=$notification_type; source=$notification_source; state=$delivery_state; sent=$sent; failed=$failed; pruned=$pruned)."
