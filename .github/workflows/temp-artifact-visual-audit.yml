name: Temporary artifact visual audit

on:
  push:
    branches:
      - fix/canonical-generation-recall-20260912
    paths:
      - ".github/workflows/temp-artifact-visual-audit.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify immutable production artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_REPOSITORY: ${{ github.repository }}
          QA_ARTIFACT_ID: "10338329369"
          QA_ZIP_SHA256: "a28f4e740c0b756c6b25a4c84f0b8e945d21540775839e0ebc971df13eb2552f"
          QA_HTML_SHA256: "65a452437377c94276c9127f58d013f54945433a7b12b3eb13b06640cdafefb8"
        run: |
          set -euo pipefail
          qa_root="$(mktemp -d)"
          printf '%s\n' "$qa_root" > "$RUNNER_TEMP/qa-root"
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/$QA_REPOSITORY/actions/artifacts/$QA_ARTIFACT_ID/zip"             > "$qa_root/artifact.zip"
          echo "$QA_ZIP_SHA256  $qa_root/artifact.zip" | sha256sum --check -
          mkdir "$qa_root/artifact"
          unzip -q "$qa_root/artifact.zip" -d "$qa_root/artifact"
          mapfile -t indexes < <(find "$qa_root/artifact" -type f -name index.html -print)
          test "${#indexes[@]}" -eq 1
          printf '%s\n' "${indexes[0]}" > "$RUNNER_TEMP/qa-index"
          echo "$QA_HTML_SHA256  ${indexes[0]}" | sha256sum --check -
          echo "QA_ARTIFACT_INTEGRITY=PASS"

      - name: Emit visible-card manifest without source-body text
        shell: bash
        run: |
          set -euo pipefail
          index_path="$(cat "$RUNNER_TEMP/qa-index")"
          python3 - "$index_path" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib
          import json
          import sys

          class VisibleCards(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = []
                  self.current = None
                  self.depth = 0
                  self.stack = []

              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  classes = set((attr.get("class") or "").split())
                  if self.current is None and tag == "article" and "story-row" in classes:
                      self.current = {"segments": [], "links": []}
                      self.depth = 1
                      self.stack = [(tag, classes)]
                      return
                  if self.current is not None:
                      self.depth += 1
                      self.stack.append((tag, classes))
                      if tag == "a" and attr.get("href"):
                          self.current["links"].append(attr["href"])

              def handle_startendtag(self, tag, attrs):
                  if self.current is not None:
                      attr = dict(attrs)
                      if tag == "a" and attr.get("href"):
                          self.current["links"].append(attr["href"])

              def handle_data(self, data):
                  if self.current is None:
                      return
                  text = " ".join(data.split())
                  if not text:
                      return
                  tags = [tag for tag, _ in self.stack]
                  if "script" in tags or "style" in tags:
                      return
                  classes = sorted({c for _, cs in self.stack for c in cs})
                  self.current["segments"].append({
                      "tag": tags[-1] if tags else "",
                      "classes": classes,
                      "text": text,
                  })

              def handle_endtag(self, tag):
                  if self.current is None:
                      return
                  if self.stack:
                      self.stack.pop()
                  self.depth -= 1
                  if self.depth == 0:
                      self.cards.append(self.current)
                      self.current = None
                      self.stack = []

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")
          parser = VisibleCards()
          parser.feed(html)
          manifest = {
              "html_sha256": hashlib.sha256(html.encode("utf-8")).hexdigest(),
              "story_count": len(parser.cards),
              "cards": parser.cards,
          }
          assert manifest["story_count"] == 6, manifest["story_count"]
          print("QA_VISIBLE_MANIFEST=" + json.dumps(manifest, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Install Korean render font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Render and measure exact desktop and mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$(cat "$RUNNER_TEMP/qa-root")"
          index_path="$(cat "$RUNNER_TEMP/qa-index")"
          site_dir="$(dirname "$index_path")"

          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site_dir"             > "$qa_root/http.log" 2>&1 &
          server_pid=$!

          driver_bin="$(command -v chromedriver || true)"
          if [[ -z "$driver_bin" && -n "${CHROMEWEBDRIVER:-}" ]]; then
            driver_bin="$(find "$CHROMEWEBDRIVER" -type f -name chromedriver -print -quit)"
          fi
          test -x "$driver_bin"
          "$driver_bin" --port=9515 --log-path="$qa_root/chromedriver.log"             > "$qa_root/chromedriver-stdout.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null               && curl --fail --silent http://127.0.0.1:9515/status >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent http://127.0.0.1:9515/status >/dev/null

          python3 - "$qa_root" <<'PY'
          import base64
          import json
          import math
          from pathlib import Path
          import time
          import urllib.request
          import sys

          qa_root = Path(sys.argv[1])
          webdriver = "http://127.0.0.1:9515"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  webdriver + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  decoded = json.loads(response.read().decode("utf-8"))
              return decoded.get("value", decoded)

          session = request(
              "POST",
              "/session",
              {
                  "capabilities": {
                      "alwaysMatch": {
                          "browserName": "chrome",
                          "goog:chromeOptions": {
                              "args": [
                                  "--headless=new",
                                  "--no-sandbox",
                                  "--disable-gpu",
                                  "--disable-background-networking",
                                  "--disable-component-update",
                                  "--disable-sync",
                                  "--hide-scrollbars",
                                  "--no-first-run",
                              ]
                          },
                      }
                  }
              },
          )
          session_id = session["sessionId"]
          prefix = f"/session/{session_id}"

          def cdp(command, params):
              return request(
                  "POST",
                  prefix + "/goog/cdp/execute",
                  {"cmd": command, "params": params},
              )

          metric_script = r"""
          const visible = (el) => {
            const style = getComputedStyle(el);
            const rect = el.getBoundingClientRect();
            return style.display !== "none" && style.visibility !== "hidden" &&
              rect.width > 0 && rect.height > 0;
          };
          const all = [...document.querySelectorAll("body *")].filter(visible);
          const overflow = all.filter((el) => {
            const rect = el.getBoundingClientRect();
            return rect.left < -0.5 || rect.right > innerWidth + 0.5;
          });
          const clipped = all.filter((el) => {
            const style = getComputedStyle(el);
            const x = el.scrollWidth > el.clientWidth + 1 &&
              !["visible", "clip"].includes(style.overflowX);
            const y = el.scrollHeight > el.clientHeight + 1 &&
              !["visible", "clip"].includes(style.overflowY);
            return x || y;
          });
          const cards = [...document.querySelectorAll("article.story-row")];
          const rects = cards.map((el) => {
            const r = el.getBoundingClientRect();
            return {top: r.top, bottom: r.bottom, left: r.left, right: r.right};
          });
          const links = [...document.querySelectorAll("article.story-row a")].map((el) => {
            const r = el.getBoundingClientRect();
            return {width: r.width, height: r.height};
          });
          return {
            viewport_width: innerWidth,
            viewport_height: innerHeight,
            device_pixel_ratio: devicePixelRatio,
            document_client_width: document.documentElement.clientWidth,
            document_scroll_width: document.documentElement.scrollWidth,
            document_scroll_height: document.documentElement.scrollHeight,
            story_count: cards.length,
            horizontal_overflow_count: overflow.length,
            clipped_visible_count: clipped.length,
            adjacent_card_overlap_count: rects.slice(1).filter(
              (r, i) => r.top < rects[i].bottom - 0.5
            ).length,
            source_link_min_width: links.length ? Math.min(...links.map((x) => x.width)) : 0,
            source_link_min_height: links.length ? Math.min(...links.map((x) => x.height)) : 0,
            story_font_family: cards.length ? getComputedStyle(cards[0]).fontFamily : "",
            overflow_sample: overflow.slice(0, 5).map(
              (el) => ({tag: el.tagName, class: String(el.className)})
            ),
            clipped_sample: clipped.slice(0, 5).map(
              (el) => ({tag: el.tagName, class: String(el.className)})
            )
          };
          """

          def capture(label, width, height, mobile):
              cdp(
                  "Emulation.setDeviceMetricsOverride",
                  {
                      "width": width,
                      "height": height,
                      "deviceScaleFactor": 1,
                      "mobile": mobile,
                  },
              )
              request("POST", prefix + "/url", {"url": "http://127.0.0.1:8765/"})
              for _ in range(40):
                  state = request(
                      "POST",
                      prefix + "/execute/sync",
                      {"script": "return document.readyState", "args": []},
                  )
                  if state == "complete":
                      break
                  time.sleep(0.1)
              time.sleep(0.5)
              metrics = request(
                  "POST",
                  prefix + "/execute/sync",
                  {"script": metric_script, "args": []},
              )
              layout = cdp("Page.getLayoutMetrics", {})
              size = layout.get("cssContentSize") or layout["contentSize"]
              shot = cdp(
                  "Page.captureScreenshot",
                  {
                      "format": "png",
                      "fromSurface": True,
                      "captureBeyondViewport": True,
                      "clip": {
                          "x": 0,
                          "y": 0,
                          "width": width,
                          "height": math.ceil(size["height"]),
                          "scale": 1,
                      },
                  },
              )
              (qa_root / f"{label.lower()}.png").write_bytes(
                  base64.b64decode(shot["data"])
              )
              if metrics["viewport_width"] != width:
                  raise SystemExit(
                      f"{label} viewport mismatch: {metrics['viewport_width']} != {width}"
                  )
              if metrics["story_count"] != 6:
                  raise SystemExit(f"{label} story count mismatch")
              print(
                  f"QA_LAYOUT_{label}="
                  + json.dumps(metrics, ensure_ascii=False, separators=(",", ":"))
              )

          try:
              capture("DESKTOP", 1440, 1000, False)
              capture("MOBILE", 390, 844, True)
          finally:
              try:
                  request("DELETE", prefix)
              except Exception:
                  pass
          PY

          file "$qa_root/desktop.png" "$qa_root/mobile.png"
          sha256sum "$qa_root/desktop.png" "$qa_root/mobile.png"

          emit_image() {
            local label="$1"
            local file_path="$2"
            local sequence=0
            while IFS= read -r chunk; do
              printf 'QA_%s_B64_%06d=%s\n' "$label" "$sequence" "$chunk"
              sequence=$((sequence + 1))
            done < <(base64 -w 4096 "$file_path")
            printf 'QA_%s_CHUNKS=%d\n' "$label" "$sequence"
          }
          emit_image DESKTOP "$qa_root/desktop.png"
          emit_image MOBILE "$qa_root/mobile.png"
          echo "QA_CHROMIUM_RENDER=PASS"
