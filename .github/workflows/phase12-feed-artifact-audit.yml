name: Phase 12 Live Feed Artifact Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase12-feed-artifact-audit.yml"
      - "config/topics.json"
      - "insight_desk/generation_pipeline.py"
      - "insight_desk/rendering.py"

concurrency:
  group: phase12-live-feed-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout feed candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install acquisition and semantic runtime
        run: |
          python -m pip install --disable-pip-version-check '.[acquisition,browser,semantic-local]'
          python -m playwright install --with-deps chromium

      - name: Install local NLI runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1

      - name: Verify required provider credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = (
              "NCP_CLIENT_ID", "NCP_CLIENT_SECRET", "GROQ_API_KEY",
              "CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("PHASE12_CREDENTIALS_MISSING:" + ",".join(missing))
          print("PHASE12_CREDENTIALS_PRESENT")
          PY

      - name: Run exact current production pipeline without deploy
        run: >-
          python scripts/phase11_daily_production.py
          --topics config/topics.json
          --output build/site
          --state build/run-state.json
          --audit build/production-audit.json

      - name: Assert reviewable site exists
        shell: bash
        run: |
          test -s build/site/index.html
          test -s build/site/assets/css/style.css
          python - <<'PY'
          from pathlib import Path
          html = Path('build/site/index.html').read_text(encoding='utf-8')
          if 'key-fact-panel' in html or 'next-signal' in html or '검색 관심 흐름' in html:
              raise SystemExit('PHASE12_UNSUPPORTED_UI_SLOT')
          print('PHASE12_REVIEWABLE_SITE_READY')
          PY

      - name: Upload exact site and audit for human inspection
        uses: actions/upload-artifact@v4
        with:
          name: phase12-live-feed-artifact-${{ github.run_id }}
          path: |
            build/site
            build/run-state.json
            build/production-audit.json
          if-no-files-found: error
          retention-days: 7
