name: Phase 3 Cloudflare Full Diagnostic

on:
  pull_request:
    branches:
      - phase3-bakeoff

permissions:
  contents: read

jobs:
  cloudflare-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify Cloudflare credentials without exposing values
        run: |
          python - <<'PY'
          import os
          account = bool(os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip())
          token = bool(os.environ.get("CLOUDFLARE_API_TOKEN", "").strip())
          print(f"CLOUDFLARE_CREDENTIALS account_id={str(account).lower()} api_token={str(token).lower()}")
          if not (account and token):
              raise SystemExit(2)
          PY
      - name: Run fair 85-case Cloudflare bake-off
        run: |
          set +e
          out=/tmp/cloudflare.jsonl
          err=/tmp/cloudflare-errors.json
          score=/tmp/cloudflare-score.json
          python benchmarks/bakeoff/run_provider.py cloudflare --output "$out" --errors "$err"
          rc=$?
          if [ -f "$out" ]; then
            python benchmarks/bakeoff/score.py "$out" --output "$score" --summary-only
          fi
          echo "CLOUDFLARE_PROVIDER_EXIT=$rc"
          if [ -f "$err" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/cloudflare-errors.json')
          data = json.loads(path.read_text()) if path.exists() else []
          print(f"CLOUDFLARE_ERROR_COUNT={len(data)}")
          for item in data[:10]:
              print("CLOUDFLARE_ERROR", json.dumps(item, ensure_ascii=False, sort_keys=True)[:1200])
          PY
          fi
          exit "$rc"
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-llama70b-bakeoff
          path: |
            /tmp/cloudflare.jsonl
            /tmp/cloudflare-errors.json
            /tmp/cloudflare-score.json
          if-no-files-found: ignore
          retention-days: 7
