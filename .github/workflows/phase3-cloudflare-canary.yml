name: Phase 3 Cloudflare Canary

on:
  pull_request:
    branches:
      - phase3-bakeoff

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify credential presence without exposing values
        run: |
          python - <<'PY'
          import os
          account = bool(os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip())
          token = bool(os.environ.get("CLOUDFLARE_API_TOKEN", "").strip())
          print(f"CLOUDFLARE_CREDENTIALS account_id={str(account).lower()} api_token={str(token).lower()}")
          if not (account and token):
              raise SystemExit(2)
          PY
      - name: Run one Workers AI structured-output canary
        env:
          PYTHONPATH: benchmarks/bakeoff
        run: |
          python - <<'PY'
          import json
          from providers import call_cloudflare

          case = {
              "id": "cloudflare-canary-001",
              "task": "MATERIAL_EVENT",
              "input": {
                  "title": "A사, AI 사업단 신설",
                  "lead": "A사가 AI 사업단을 신설했다."
              },
          }
          result = call_cloudflare(case)
          print("CLOUDFLARE_CANARY_OK " + json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
