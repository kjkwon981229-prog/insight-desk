name: Phase 3 Gemini Full Bake-off

on:
  pull_request:
    branches:
      - phase3-bakeoff
    paths:
      - ".github/workflows/phase3-gemini-canary.yml"

permissions:
  contents: read

jobs:
  gemini-full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Confirm key presence without exposing value
        run: |
          python - <<'PY'
          import os
          print(f"gemini={bool(os.environ.get('GEMINI_API_KEY','').strip())}")
          if not os.environ.get('GEMINI_API_KEY','').strip():
              raise SystemExit(2)
          PY
      - name: Run all 85 cases with Gemini 3.7 Flash Free Tier
        run: |
          set +e
          python benchmarks/bakeoff/run_provider.py gemini --output /tmp/gemini.jsonl --errors /tmp/gemini-errors.json
          rc=$?
          if [ -s /tmp/gemini-errors.json ]; then
            cat /tmp/gemini-errors.json
          fi
          if [ -s /tmp/gemini.jsonl ]; then
            python benchmarks/bakeoff/score.py /tmp/gemini.jsonl --output /tmp/gemini-score.json --summary-only
          fi
          exit "$rc"
