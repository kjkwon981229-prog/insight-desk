name: Phase 5 Live Acquisition Canary

on:
  push:
    branches:
      - phase5-live-acquisition-canary
  pull_request:
    branches:
      - phase4-core-contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify NAVER credentials are available without printing values
        run: |
          python - <<'PY'
          import os
          required = ("NCP_CLIENT_ID", "NCP_CLIENT_SECRET")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("missing credentials: " + ",".join(missing))
          print("NAVER_CREDENTIALS_AVAILABLE")
          PY
      - name: Install acquisition runtimes
        run: python -m pip install -e '.[acquisition,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run bounded live acquisition canary
        run: python scripts/phase5_live_acquisition_canary.py
