name: Insight Desk Event Understanding Provider Qualification V6

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Candidate provider or bounded shortlist
        required: true
        default: shortlist
        type: choice
        options:
          - shortlist
          - groq_120b
          - cohere_command_a_plus
          - cerebras_glm_47
  push:
    branches:
      - postmerge-event-understanding-provider-qualification

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[provider-qualification-v6]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install qualification runtime
        run: python -m pip install --disable-pip-version-check .

      - name: Validate V6 qualification contract
        run: python -m unittest tests.test_event_understanding_qualification_v6

  shortlist:
    needs: contract
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[provider-qualification-v6]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'shortlist')
    strategy:
      fail-fast: false
      matrix:
        provider:
          - groq_120b
          - cohere_command_a_plus
          - cerebras_glm_47
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install qualification runtime
        run: python -m pip install --disable-pip-version-check .

      - name: Run frozen V6 candidate qualification
        id: qualify
        continue-on-error: true
        run: >-
          python scripts/qualify_event_understanding_provider_v6.py
          --provider '${{ matrix.provider }}'
          --report 'event-understanding-qualification-v6-${{ matrix.provider }}.json'

      - name: Show bounded qualification report
        if: always()
        run: cat 'event-understanding-qualification-v6-${{ matrix.provider }}.json'

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-understanding-v6-${{ matrix.provider }}-${{ github.run_id }}
          path: event-understanding-qualification-v6-${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Require automatic regression pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = '${{ matrix.provider }}'
          report = json.loads(Path(f'event-understanding-qualification-v6-{provider}.json').read_text(encoding='utf-8'))
          if report.get('status') != 'AUTOMATIC_REGRESSION_PASS':
              raise SystemExit(f"{provider}: {report.get('status')}")
          if report.get('provider_selection_eligible') is not False:
              raise SystemExit('automatic V6 pass must not select or wire a provider')
          PY

  selected:
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.provider != 'shortlist'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install qualification runtime
        run: python -m pip install --disable-pip-version-check .

      - name: Run frozen V6 candidate qualification
        id: qualify
        continue-on-error: true
        run: >-
          python scripts/qualify_event_understanding_provider_v6.py
          --provider '${{ inputs.provider }}'
          --report 'event-understanding-qualification-v6-${{ inputs.provider }}.json'

      - name: Show bounded qualification report
        if: always()
        run: cat 'event-understanding-qualification-v6-${{ inputs.provider }}.json'

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-understanding-v6-${{ inputs.provider }}-${{ github.run_id }}
          path: event-understanding-qualification-v6-${{ inputs.provider }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Require automatic regression pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provider = '${{ inputs.provider }}'
          report = json.loads(Path(f'event-understanding-qualification-v6-{provider}.json').read_text(encoding='utf-8'))
          if report.get('status') != 'AUTOMATIC_REGRESSION_PASS':
              raise SystemExit(f"{provider}: {report.get('status')}")
          if report.get('provider_selection_eligible') is not False:
              raise SystemExit('automatic V6 pass must not select or wire a provider')
          PY
