name: Phase 3 Zero-Cost Bake-off

on:
  push:
    branches:
      - phase3-bakeoff
      - phase3-bakeoff-local
      - phase3-credential-probe
      - phase3-provider-adapters
    paths:
      - "benchmarks/**"
      - ".github/workflows/phase3-bakeoff.yml"
  pull_request:
    branches:
      - phase3-bakeoff
    paths:
      - "benchmarks/**"
      - ".github/workflows/phase3-bakeoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile bake-off harness
        run: python -m compileall -q benchmarks/bakeoff
      - name: Verify normalized 85-case dataset
        run: python benchmarks/bakeoff/dataset.py --check
      - name: Verify provider request contracts offline
        run: PYTHONPATH=benchmarks/bakeoff python -m unittest discover -s benchmarks/bakeoff -p 'test_*.py'

  credential-availability:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Report credential presence without exposing values
        run: python benchmarks/bakeoff/credential_probe.py

  local-semantic-baselines:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install CPU-only zero-cost local evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "sentence-transformers==5.7.0" \
            "transformers==5.14.1" \
            "sentencepiece==0.2.1"
      - name: Run multilingual NLI diagnostic
        run: python benchmarks/bakeoff/local_nli.py --output /tmp/local-nli.json
      - name: Run multilingual same-event retrieval diagnostic
        run: python benchmarks/bakeoff/local_similarity.py --output /tmp/local-similarity.json

  groq-free-bakeoff:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run GPT-OSS 20B then 120B under Free-plan limits
        run: |
          set +e
          final=0
          for provider in groq20 groq120; do
            out="/tmp/${provider}.jsonl"
            err="/tmp/${provider}-errors.json"
            python benchmarks/bakeoff/run_provider.py "$provider" --output "$out" --errors "$err"
            rc=$?
            if [ -f "$out" ]; then
              python benchmarks/bakeoff/score.py "$out" --output "/tmp/${provider}-score.json" --summary-only
            fi
            if [ "$rc" -ne 0 ]; then final="$rc"; fi
          done
          exit "$final"

  cloudflare-free-bakeoff:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run Workers AI only inside Free allocation
        run: |
          set +e
          out=/tmp/cloudflare.jsonl
          python benchmarks/bakeoff/run_provider.py cloudflare --output "$out" --errors /tmp/cloudflare-errors.json
          rc=$?
          if [ -f "$out" ]; then
            python benchmarks/bakeoff/score.py "$out" --output /tmp/cloudflare-score.json --summary-only
          fi
          exit "$rc"

  gemini-free-bakeoff:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run Gemini API Free tier only
        run: |
          set +e
          out=/tmp/gemini.jsonl
          python benchmarks/bakeoff/run_provider.py gemini --output "$out" --errors /tmp/gemini-errors.json
          rc=$?
          if [ -f "$out" ]; then
            python benchmarks/bakeoff/score.py "$out" --output /tmp/gemini-score.json --summary-only
          fi
          exit "$rc"
