name: Final Production Closure

on:
  push:
    branches: [main]

concurrency:
  group: final-production-closure
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event.head_commit.message != 'Record final production closure pass'
    runs-on: ubuntu-latest
    outputs:
      payload_sha: ${{ steps.meta.outputs.payload_sha }}
      generated_at: ${{ steps.meta.outputs.generated_at }}
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
    steps:
      - name: Checkout exact production code
        uses: actions/checkout@v6
        with:
          ref: 18a304b5b153c7c2237ce06f111c2e3ff62923fb
      - name: Require exact production SHA
        run: test "$(git rev-parse HEAD)" = "18a304b5b153c7c2237ce06f111c2e3ff62923fb"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Restore durable public history
        shell: bash
        run: |
          mkdir -p build/site/latest
          curl --fail --silent --show-error --location --max-time 15 \
            "https://kjkwon981229-prog.github.io/insight-desk/latest/data.json?before=${GITHUB_RUN_ID}" \
            -o build/site/latest/data.json || rm -f build/site/latest/data.json
      - name: Build production fresh live
        run: python -m insight_desk.cli --config config/topics.json --output build/site --state-file build/run-state.json --cache .cache/responses.json
      - name: Hard-gate production output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_artifact.py build/site
          python scripts/validate_live_acceptance.py build/live-acceptance.json
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build/run-state.json').read_text(encoding='utf-8'))
          assert state.get('status') == 'COMPLETE', state
          assert state.get('publish') is True, state
          assert state.get('news',{}).get('failed') == 0, state
          audit=json.loads(Path('build/selection-audit.json').read_text(encoding='utf-8'))
          strong=sum(int(v.get('strong_rejected',0) or 0) for v in audit.get('funnel',{}).values())
          assert strong == 0, audit.get('funnel')
          acceptance=json.loads(Path('build/live-acceptance.json').read_text(encoding='utf-8'))
          assert acceptance.get('semantic_error_count',0) == 0, acceptance
          payload=json.loads(Path('build/site/latest/data.json').read_text(encoding='utf-8'))
          stories=payload.get('stories',[])
          for story in stories:
              title=story.get('title','')
              summary=story.get('summary','')
              assert title and summary, story
              assert '출범 소식이 확인됐다' not in summary, story
              assert '빅 멜론' not in title, story
          launch=[s for s in stories if '선정위원회 출범' in s.get('title','')]
          if launch:
              assert launch[0].get('summary') == 'KBO의 한국야구 명예의 전당 선정위원회가 출범했다.', launch[0]
          print('PRODUCTION_STATE', json.dumps(state,ensure_ascii=False,sort_keys=True))
          print('PRODUCTION_ACCEPTANCE', json.dumps(acceptance,ensure_ascii=False,sort_keys=True))
          print('PRODUCTION_STORIES', json.dumps(stories,ensure_ascii=False,sort_keys=True))
          PY
      - name: Record public payload identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          payload_sha="$(sha256sum build/site/latest/data.json | awk '{print $1}')"
          generated_at="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('build/site/latest/data.json').read_text(encoding='utf-8'))['state']['generated_at'])
          PY
          )"
          echo "payload_sha=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_PAYLOAD_SHA=$payload_sha"
          echo "PRODUCTION_GENERATED_AT=$generated_at"
      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-production-closure-evidence-${{ github.run_id }}
          path: |
            build/run-state.json
            build/selection-audit.json
            build/live-acceptance.json
            build/site/latest/data.json
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact production artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Require public Pages payload to equal deployed artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.payload_sha }}
          EXPECTED_GENERATED_AT: ${{ needs.build.outputs.generated_at }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/public-data.json"
          matched=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 \
              "https://kjkwon981229-prog.github.io/insight-desk/latest/data.json?closure=${GITHUB_RUN_ID}-${attempt}" \
              -o "$tmp"; then
              actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
              if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
                matched=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$matched" != "true" ]]; then
            echo "::error::Public Pages payload never matched the deployed artifact."
            exit 1
          fi
          actual_generated_at="$(python - "$tmp" <<'PY'
          import json,sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['state']['generated_at'])
          PY
          )"
          test "$actual_generated_at" = "$EXPECTED_GENERATED_AT"
          echo "PUBLIC_PAYLOAD_VERIFIED sha=$EXPECTED_SHA generated_at=$actual_generated_at"

  push_notify:
    needs: [build, deploy, verify_public]
    runs-on: ubuntu-latest
    outputs:
      delivery_state: ${{ steps.push.outputs.delivery_state }}
      sent: ${{ steps.push.outputs.sent }}
      failed: ${{ steps.push.outputs.failed }}
      subscription_count: ${{ steps.push.outputs.subscription_count }}
    env:
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
      PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
    steps:
      - name: Send and require actual READY delivery
        id: push
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PUSH_SEND_TOKEN"
          [[ "$PUSH_WORKER_URL" == https://* ]]
          [[ -n "$PUSH_SEND_TOKEN" ]]
          briefing_date="$(TZ=Asia/Seoul date +%F)"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(printf '{"date":"%s","run_id":"%s","type":"READY","source":"manual"}' "$briefing_date" "$run_id")"
          response_file="${RUNNER_TEMP}/push-response.json"
          http_status="$(curl --silent --show-error --max-time 20 --output "$response_file" --write-out '%{http_code}' \
            -X POST "${PUSH_WORKER_URL%/}/send" \
            -H "Authorization: Bearer $PUSH_SEND_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          [[ "$http_status" =~ ^2[0-9][0-9]$ ]]
          jq -e '(.request_state == "REQUEST_ACCEPTED") and (.duplicate == false) and (.delivery_state == "DELIVERED") and (.sent >= 1) and (.failed == 0)' "$response_file" >/dev/null
          delivery_state="$(jq -r '.delivery_state' "$response_file")"
          sent="$(jq -r '.sent' "$response_file")"
          failed="$(jq -r '.failed' "$response_file")"
          subscription_count="$(jq -r '.subscription_count' "$response_file")"
          echo "delivery_state=$delivery_state" >> "$GITHUB_OUTPUT"
          echo "sent=$sent" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "subscription_count=$subscription_count" >> "$GITHUB_OUTPUT"
          echo "PUSH_DELIVERY_VERIFIED state=$delivery_state sent=$sent failed=$failed subscriptions=$subscription_count"

  closure:
    needs: [build, deploy, verify_public, push_notify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAYLOAD_SHA: ${{ needs.build.outputs.payload_sha }}
      GENERATED_AT: ${{ needs.build.outputs.generated_at }}
      DELIVERY_STATE: ${{ needs.push_notify.outputs.delivery_state }}
      SENT: ${{ needs.push_notify.outputs.sent }}
      FAILED: ${{ needs.push_notify.outputs.failed }}
      SUBSCRIPTION_COUNT: ${{ needs.push_notify.outputs.subscription_count }}
    steps:
      - name: Checkout current main for success marker
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record verified production closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              'status': 'FINAL_PRODUCTION_CLOSURE_PASS',
              'production_code_sha': '18a304b5b153c7c2237ce06f111c2e3ff62923fb',
              'workflow_event_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'payload_sha': os.environ['PAYLOAD_SHA'],
              'generated_at': os.environ['GENERATED_AT'],
              'delivery_state': os.environ['DELIVERY_STATE'],
              'sent': int(os.environ['SENT']),
              'failed': int(os.environ['FAILED']),
              'subscription_count': int(os.environ['SUBSCRIPTION_COUNT']),
          }
          Path('verification/final-production-closure-pass.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(record, ensure_ascii=False, sort_keys=True))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/final-production-closure-pass.json
          git commit -m 'Record final production closure pass'
          git push origin HEAD:main
