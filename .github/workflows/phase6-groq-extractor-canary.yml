name: Phase 6 Groq Fact Extractor Canary

on:
  pull_request:
    branches:
      - phase4-core-contracts

permissions:
  contents: read

jobs:
  bounded-canary:
    if: github.head_ref == 'phase6-groq-fact-extractor-canary'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Verify canary credential is configured
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("GROQ_API_KEY", "").strip():
              raise SystemExit("GROQ_API_KEY is not configured for the bounded canary")
          print("Groq canary credential: configured")
          PY
      - name: Run extractor contract regressions
        run: python -m unittest discover -s tests -p 'test_groq_fact_extractor.py'
      - name: Run bounded locked-SSOT extractor canary
        run: python scripts/phase6_groq_fact_extractor_canary.py
