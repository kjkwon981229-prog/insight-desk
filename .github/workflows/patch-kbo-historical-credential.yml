name: Patch KBO Historical Credential

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/award-chart-subject-binding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/award-chart-subject-binding
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Add exact live regression and prove current failure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_live_residual_regressions.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    def test_comeback_date_is_not_absorbed_into_subject_or_repeated(self) -> None:\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(anchor)}')
          method = '''    def test_historical_wbc_championship_credential_is_not_a_current_sports_result(self) -> None:\n        item = _item(\n            "sportschosun-wbc-champion-manager-visit",\n            "kbo_hanwha",\n            'WBC 우승 감독의 KBO 방문, 허구연 총재와 "야구 인기 확대방안" 논의',\n            "20일 KBO를 방문했다. 구리야마 히데키 닛폰햄 CBO는 허구연 총재와 야구 인기 확대 방안을 논의했다.",\n            "https://www.sportschosun.com/baseball/2026-08-21/202608210100126560008034",\n            enriched=True,\n        )\n        assessment = assess_event(StoryCluster("kbo_hanwha", (item,)), _kbo_topic())\n        self.assertEqual(assessment.event_type, "OTHER")\n        self.assertFalse(assessment.passed)\n\n'''
          path.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')
          PY
          set +e
          python -m unittest tests.test_live_residual_regressions.LiveResidualRegressionTests.test_historical_wbc_championship_credential_is_not_a_current_sports_result -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passed before source patch.' >&2
            exit 1
          fi
          echo 'EXPECTED_PREPATCH_FAILURE_CONFIRMED'
      - name: Patch only historical credential classification boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('insight_desk/pipeline/editorial.py')
          text = path.read_text(encoding='utf-8')
          old = '''    industry_discussion_only = bool(\n        re.search(\n            r"(?:확대|축소|전략)\\s*(?:방안|계획|대책)?[^.!?]{0,32}(?:논의|검토|협의|모색)",\n            normalized_source,\n        )\n    )\n    for candidate_type, patterns, value in _EVENT_PATTERNS:\n'''
          new = '''    industry_discussion_only = bool(\n        re.search(\n            r"(?:확대|축소|전략)\\s*(?:방안|계획|대책)?[^.!?]{0,32}(?:논의|검토|협의|모색)",\n            normalized_source,\n        )\n    )\n    historical_sports_credential = bool(\n        re.search(r"우승\\s*(?:감독|코치|사령탑|멤버|주역)", normalized_source)\n    )\n    for candidate_type, patterns, value in _EVENT_PATTERNS:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one event-source prelude, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = '''        hits = [pattern for pattern in patterns if _event_term_match(source, pattern)]\n        if candidate_type == "INDUSTRY_CHANGE" and hits and industry_discussion_only:\n            continue\n        if hits and value > detected_value:\n'''
          new2 = '''        hits = [pattern for pattern in patterns if _event_term_match(source, pattern)]\n        # "우승 감독/코치/사령탑" is a historical credential, not evidence\n        # that the article reports a current game result. Remove only that\n        # bare championship hit; independent current-result predicates remain.\n        if candidate_type == "SPORTS_RESULT" and hits and historical_sports_credential:\n            hits = [hit for hit in hits if hit != "우승"]\n        if candidate_type == "INDUSTRY_CHANGE" and hits and industry_discussion_only:\n            continue\n        if hits and value > detected_value:\n'''
          if text.count(old2) != 1:
              raise SystemExit(f'expected one event-source hit block, found {text.count(old2)}')
          path.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          PY
      - name: Validate targeted and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest tests.test_live_residual_regressions -v
          python -m unittest discover -s tests -q
          python scripts/build_fixture_site.py
          python scripts/validate_artifact.py build/fixture-site
          cd push-worker
          npm ci
          npm test
      - name: Commit production patch and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/workflows/patch-kbo-historical-credential.yml
          git add -- insight_desk/pipeline/editorial.py tests/test_live_residual_regressions.py
          git diff --cached --check
          git commit -m "Ignore historical championship credentials in sports results"
          git push origin HEAD:fix/award-chart-subject-binding
