name: Final Production Closure Probe

on:
  pull_request:
    branches: [main]

concurrency:
  group: insight-desk-final-production-closure
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      status: ${{ steps.state.outputs.status }}
    steps:
      - name: Checkout exact current production
        uses: actions/checkout@v6
        with:
          ref: 83c5b98ec22898da890013a4f872aeeabe5f28bf
      - name: Require exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "83c5b98ec22898da890013a4f872aeeabe5f28bf"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Mask API values
        shell: bash
        run: |
          echo "::add-mask::$NCP_CLIENT_ID"
          echo "::add-mask::$NCP_CLIENT_SECRET"
          echo "::add-mask::$OPENDART_API_KEY"
          echo "::add-mask::$KOSIS_API_KEY"
          echo "::add-mask::$ECOS_API_KEY"
      - name: Restore durable history from current public Pages
        shell: bash
        run: |
          set -u
          mkdir -p build/site/latest
          curl --fail --silent --show-error --location --max-time 15 https://kjkwon981229-prog.github.io/insight-desk/latest/data.json -o build/site/latest/data.json || rm -f build/site/latest/data.json
      - name: Build fresh production briefing
        run: >-
          python -m insight_desk.cli
          --config config/topics.json
          --output build/site
          --state-file build/run-state.json
          --cache .cache/responses.json
      - name: Read and require publishable state
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('build/run-state.json').read_text(encoding='utf-8'))
          status = str(state.get('status', 'TOTAL_FAILURE'))
          publish = state.get('publish') is True
          assert publish, state
          assert status not in {'TOTAL_FAILURE','FILTER_COLLAPSE','RENDER_FAILURE','VALIDATION_FAILURE'}, state
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"status={status}\n")
              output.write(f"publish={'true' if publish else 'false'}\n")
          print('PRODUCTION_RUN_STATE', json.dumps(state, ensure_ascii=False, sort_keys=True))
          PY
      - name: Validate Pages artifact
        run: python scripts/validate_artifact.py build/site
      - name: Validate live editorial acceptance
        run: python scripts/validate_live_acceptance.py build/live-acceptance.json
      - name: Print production public stories
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('build/site/latest/data.json').read_text(encoding='utf-8'))
          print('PRODUCTION_PUBLIC_STORIES', json.dumps(payload.get('stories', []), ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload closure audit
        uses: actions/upload-artifact@v4
        with:
          name: final-production-closure-audit-${{ github.run_id }}
          path: |
            build/selection-audit.json
            build/live-acceptance.json
            build/site/latest/data.json
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: final-production-closure-probe
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact production fresh live to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  push_notify:
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
      PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
    steps:
      - name: Mask push token
        shell: bash
        run: echo "::add-mask::$PUSH_SEND_TOKEN"
      - name: Send and require unique manual delivery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUSH_WORKER_URL"
          test -n "$PUSH_SEND_TOKEN"
          case "$PUSH_WORKER_URL" in https://*) ;; *) exit 1 ;; esac
          briefing_date="$(TZ=Asia/Seoul date +%F)"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(printf '{\"date\":\"%s\",\"run_id\":\"%s\",\"type\":\"READY\",\"source\":\"manual\"}' "$briefing_date" "$run_id")"
          response_file="${RUNNER_TEMP}/push-response.json"
          http_status="$(curl --silent --show-error --max-time 20 --output "$response_file" --write-out '%{http_code}' -X POST "${PUSH_WORKER_URL%/}/send" -H "Authorization: Bearer $PUSH_SEND_TOKEN" -H "Content-Type: application/json" --data "$payload")"
          [[ "$http_status" =~ ^2[0-9][0-9]$ ]]
          jq -e '(.request_state == "REQUEST_ACCEPTED") and (.duplicate == false) and (.delivery_state == "DELIVERED") and (.sent >= 1) and (.failed == 0)' "$response_file" >/dev/null
          jq '{request_state,duplicate,delivery_state,subscription_count,sent,failed,pruned,source}' "$response_file"
