name: Patch Natural Launch Summary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/award-chart-subject-binding'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/award-chart-subject-binding
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Add exact search-snippet regression and prove current copy defect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_live_residual_regressions.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    # Exact 2026-08-21 human-audit P1: the chart/platform name must not be\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {text.count(anchor)}')
          method = '''    def test_search_snippet_committee_launch_uses_natural_completed_summary(self) -> None:\n        item = _item(\n            "kbo-hall-of-fame-committee-launch-search-only",\n            "kbo_hanwha",\n            "KBO, 한국야구 명예의 전당 선정위원회 출범",\n            "KBO, 한국야구 명예의 전당 선정위원회 출범",\n            "https://www.yna.co.kr/view/AKR20260821144000007?input=1195m",\n            enriched=False,\n        )\n        cluster = StoryCluster("kbo_hanwha", (item,))\n        event = assess_event(cluster, _kbo_topic())\n        self.assertEqual(event.event_type, "ANNOUNCEMENT")\n        self.assertTrue(event.passed)\n        assert event.canonical_event is not None\n        headline, summary, _, _, facts, _ = synthesize_cluster(\n            cluster,\n            topic_name="KBO·한화 이글스",\n            trend_metrics=(),\n            event_type_override=event.event_type,\n            event_signature_override=event.canonical_event.event_signature,\n            canonical_event_override=event.canonical_event,\n        )\n        self.assertEqual(headline, "KBO, 한국야구 명예의 전당 선정위원회 출범")\n        self.assertEqual(summary, "KBO의 한국야구 명예의 전당 선정위원회가 출범했다.")\n        self.assertEqual(facts.subject, "KBO")\n        self.assertEqual(facts.action, "출범")\n        self.assertEqual(facts.object, "한국야구 명예의 전당 선정위원회")\n\n'''
          path.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')
          PY
          set +e
          python -m unittest tests.test_live_residual_regressions.LiveResidualRegressionTests.test_search_snippet_committee_launch_uses_natural_completed_summary -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Natural-copy regression unexpectedly passed before source patch.' >&2
            exit 1
          fi
          echo 'EXPECTED_PREPATCH_COPY_FAILURE_CONFIRMED'
      - name: Patch generic unknown-temporal launch rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('insight_desk/pipeline/synthesis.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if temporal_mode == "UNKNOWN":\n        subject_prefix = f"{subject}{_particle(subject)}"\n        if action in {"선정", "지정"}:\n            return f"{subject_prefix} {object_text} {action} 사실이 확인됐다."\n        if action == "떠남":\n            return f"{subject_prefix} {object_text}{_object_particle(object_text)} 떠나는 내용이 확인됐다."\n        return f"{subject_prefix} {object_text} {action} 소식이 확인됐다."\n'''
          new = '''    if temporal_mode == "UNKNOWN":\n        subject_prefix = f"{subject}{_particle(subject)}"\n        if action in {"선정", "지정"}:\n            return f"{subject_prefix} {object_text} {action} 사실이 확인됐다."\n        if action == "떠남":\n            return f"{subject_prefix} {object_text}{_object_particle(object_text)} 떠나는 내용이 확인됐다."\n        # A bare Korean launch headline ("기관, 위원회 출범") conventionally\n        # reports that the named body has launched. Render that owned relation\n        # directly instead of generic meta-copy such as "출범 소식이 확인됐다".\n        if action == "출범":\n            return f"{subject}의 {object_text}{_subject_particle(object_text)} 출범했다."\n        return f"{subject_prefix} {object_text} {action} 소식이 확인됐다."\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one UNKNOWN relation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate exact copy and complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest tests.test_live_residual_regressions -v
          python -m unittest discover -s tests -q
          python scripts/build_fixture_site.py
          python scripts/validate_artifact.py build/fixture-site
          cd push-worker
          npm ci
          npm test
      - name: Commit production/test patch and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/workflows/patch-natural-launch-summary.yml
          git add -- insight_desk/pipeline/synthesis.py tests/test_live_residual_regressions.py
          git diff --cached --check
          git commit -m "Render bounded launch announcements naturally"
          git push origin HEAD:fix/award-chart-subject-binding
