name: Insight Desk Infrastructure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile Python packages
        run: python -m compileall -q insight_desk
      - name: Validate preserved JSON configuration and PWA manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("config/topics.json", "config/authoritative_sources.json", "manifest.webmanifest"):
              json.loads(Path(name).read_text(encoding="utf-8"))
          PY
      - name: Validate clean-room benchmark integrity
        run: python benchmarks/validate.py
      - name: Run clean core contract regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify preserved API and new core import boundaries
        run: |
          python - <<'PY'
          from insight_desk.api import EcosClient, KosisClient, NaverApiClient, OpenDartClient
          from insight_desk.core import ContractBundle, EventFact, RawArticle, VerifiedClaim
          print(EcosClient, KosisClient, NaverApiClient, OpenDartClient)
          print(ContractBundle, EventFact, RawArticle, VerifiedClaim)
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: push-worker/package-lock.json
      - name: Run preserved push Worker tests
        working-directory: push-worker
        run: npm ci && npm test

  local_nli_benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Read exact head commit marker
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --format=%B)"
          if grep -Fq '[nli-benchmark]' <<<"$message"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_NLI_BENCHMARK_REQUESTED'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_NLI_BENCHMARK_SKIPPED'
          fi
      - name: Set up Python for local NLI benchmark
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install measured local NLI runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1 protobuf==6.33.5
      - name: Run locked primary and candidate local NLI benchmark
        if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=. python scripts/phase12b_local_nli_benchmark.py --output build/local-nli-benchmark.json
      - name: Enforce candidate secondary-failover acceptance rule
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/local-nli-benchmark.json').read_text(encoding='utf-8'))
          fallback = result['fallback']
          if fallback['accepted_for_secondary_failover'] is not True:
              raise SystemExit(
                  'LOCAL_NLI_SECONDARY_FAILOVER_REJECTED '
                  f"model={fallback['model_id']} "
                  f"positive={fallback['positive_correct']}/{fallback['positive_total']} "
                  f"negative={fallback['negative_correct']}/{fallback['negative_total']}"
              )
          print(
              'LOCAL_NLI_SECONDARY_FAILOVER_ACCEPTED '
              f"model={fallback['model_id']} "
              f"positive={fallback['positive_correct']}/{fallback['positive_total']} "
              f"negative={fallback['negative_correct']}/{fallback['negative_total']}"
          )
          PY
      - name: Upload local NLI benchmark evidence
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('build/local-nli-benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase12b-local-nli-benchmark-${{ github.run_id }}
          path: build/local-nli-benchmark.json
          if-no-files-found: error
          retention-days: 14

  gemini_canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Require explicit provider-canary marker
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --format=%B)"
          if grep -Fq '[provider-canary]' <<<"$message"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_PROVIDER_CANARY_REQUESTED'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_PROVIDER_CANARY_SKIPPED'
          fi
      - name: Set up Python for Gemini canary
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run bounded Gemini claim-verifier canary
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from insight_desk.providers.gemini import GeminiClaimVerifier, GeminiStructuredClient

          output = Path('build/gemini-canary.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          if not GeminiStructuredClient.configured():
              result = {'configured': False, 'positive': None, 'negative': None, 'error': 'not_configured'}
              output.write_text(json.dumps(result, indent=2), encoding='utf-8')
              raise SystemExit('GEMINI_FREE_ROUTE_NOT_CONFIGURED')

          verifier = GeminiClaimVerifier(GeminiStructuredClient.from_env())
          evidence = '테스트 기업은 2026년 8월 23일 신제품을 출시했다.'
          positive = verifier.verify(
              check_id='canary:positive',
              claim_text='테스트 기업이 2026년 8월 23일 신제품을 출시했다.',
              evidence_text=evidence,
              evidence_ids=('canary:evidence',),
          )
          negative = verifier.verify(
              check_id='canary:negative',
              claim_text='테스트 기업이 신제품 출시를 취소했다.',
              evidence_text=evidence,
              evidence_ids=('canary:evidence',),
          )
          result = {
              'configured': True,
              'positive': positive.entailed,
              'positive_error': positive.error_code,
              'negative': negative.entailed,
              'negative_error': negative.error_code,
              'model_id': verifier.model_id,
          }
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          if positive.entailed is not True or negative.entailed is not False:
              raise SystemExit(
                  'GEMINI_FREE_ROUTE_CANARY_REJECTED '
                  f"positive={positive.entailed} negative={negative.entailed}"
              )
          print('GEMINI_FREE_ROUTE_CANARY_ACCEPTED')
          PY
      - name: Upload Gemini canary evidence
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('build/gemini-canary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase12b-gemini-canary-${{ github.run_id }}
          path: build/gemini-canary.json
          if-no-files-found: error
          retention-days: 14

  pecab_canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Require explicit semantic-canary marker
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --format=%B)"
          if grep -Fq '[semantic-canary]' <<<"$message"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_PECAB_CANARY_REQUESTED'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_PECAB_CANARY_SKIPPED'
          fi
      - name: Set up Python for PeCab canary
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install PeCab candidate runtime
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pecab==1.0.8
      - name: Verify Korean POS contract
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pecab import PeCab

          analyzer = PeCab()
          cases = (
              '정부는 9월 3일부터 새 제도를 시행한다고 밝혔다.',
              '한화는 이날 승리로 연패를 끊었다.',
              '생산자물가는 전월보다 0.4% 상승했다.',
          )
          rows = []
          for text in cases:
              tagged = analyzer.pos(text)
              tags = [str(tag) for _, tag in tagged]
              if not tagged or not any(tag.startswith('J') for tag in tags):
                  raise SystemExit('PECAB_CANARY_MISSING_CASE_PARTICLE')
              if not any(tag.startswith('V') or 'XSV' in tag for tag in tags):
                  raise SystemExit('PECAB_CANARY_MISSING_PREDICATE')
              rows.append({'text': text, 'tags': tags})
          path = Path('build/pecab-canary.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'accepted': True, 'cases': rows}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PECAB_SEMANTIC_FALLBACK_CANARY_ACCEPTED')
          PY
      - name: Upload PeCab canary evidence
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('build/pecab-canary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase12b-pecab-canary-${{ github.run_id }}
          path: build/pecab-canary.json
          if-no-files-found: error
          retention-days: 14
