name: Insight Desk Infrastructure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile Python packages
        run: python -m compileall -q insight_desk
      - name: Validate preserved JSON configuration and PWA manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("config/topics.json", "config/authoritative_sources.json", "manifest.webmanifest"):
              json.loads(Path(name).read_text(encoding="utf-8"))
          PY
      - name: Validate clean-room benchmark integrity
        run: python benchmarks/validate.py
      - name: Run clean core contract regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify preserved API and new core import boundaries
        run: |
          python - <<'PY'
          from insight_desk.api import EcosClient, KosisClient, NaverApiClient, OpenDartClient
          from insight_desk.core import ContractBundle, EventFact, RawArticle, VerifiedClaim
          print(EcosClient, KosisClient, NaverApiClient, OpenDartClient)
          print(ContractBundle, EventFact, RawArticle, VerifiedClaim)
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: push-worker/package-lock.json
      - name: Run preserved push Worker tests
        working-directory: push-worker
        run: npm ci && npm test

  local_nli_benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Read exact head commit marker
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --format=%B)"
          if grep -Fq '[nli-benchmark]' <<<"$message"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_NLI_BENCHMARK_REQUESTED'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'PHASE12B_NLI_BENCHMARK_SKIPPED'
          fi

      - name: Set up Python for local NLI benchmark
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install measured local NLI runtime
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1

      - name: Run locked mDeBERTa and MiniLM benchmark
        if: steps.gate.outputs.run == 'true'
        run: python scripts/phase12b_local_nli_benchmark.py --output build/local-nli-benchmark.json

      - name: Enforce MiniLM secondary-failover acceptance rule
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/local-nli-benchmark.json').read_text(encoding='utf-8'))
          fallback = result['fallback']
          if fallback['accepted_for_secondary_failover'] is not True:
              raise SystemExit(
                  'MINILM_SECONDARY_FAILOVER_REJECTED '
                  f"positive={fallback['positive_correct']}/{fallback['positive_total']} "
                  f"negative={fallback['negative_correct']}/{fallback['negative_total']}"
              )
          print(
              'MINILM_SECONDARY_FAILOVER_ACCEPTED '
              f"positive={fallback['positive_correct']}/{fallback['positive_total']} "
              f"negative={fallback['negative_correct']}/{fallback['negative_total']}"
          )
          PY

      - name: Upload local NLI benchmark evidence
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('build/local-nli-benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase12b-local-nli-benchmark-${{ github.run_id }}
          path: build/local-nli-benchmark.json
          if-no-files-found: error
          retention-days: 14
