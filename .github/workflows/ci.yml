name: Insight Desk Infrastructure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Compile Python packages
        run: python -m compileall -q insight_desk
      - name: Validate preserved JSON configuration and PWA manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (
              "config/topics.json",
              "config/semantic_topics_v2.json",
              "config/event_understanding_provider_status_v2.json",
              "config/authoritative_sources.json",
              "manifest.webmanifest",
          ):
              json.loads(Path(name).read_text(encoding="utf-8"))
          PY
      - name: Validate clean-room benchmark integrity
        run: python benchmarks/validate.py
      - name: Run clean core contract regressions
        run: python scripts/run_tests.py
      - name: Verify preserved API and new core import boundaries
        run: |
          python - <<'PY'
          from insight_desk.api import EcosClient, KosisClient, NaverApiClient, OpenDartClient
          from insight_desk.core import ContractBundle, EventFact, RawArticle, VerifiedClaim
          print(EcosClient, KosisClient, NaverApiClient, OpenDartClient)
          print(ContractBundle, EventFact, RawArticle, VerifiedClaim)
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: push-worker/package-lock.json
      - name: Run preserved push Worker tests
        working-directory: push-worker
        run: npm ci && npm test

  historical-production-replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact replay head
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install production deterministic semantic runtime
        run: python -m pip install --disable-pip-version-check '.[semantic-local]'
      - name: Run recorded historical production replay
        run: python -m unittest discover -s tests -p 'test_phase5_real_production_replay_v2.py'
      - name: Run Phase 6 correctness and recall gate
        run: python -m unittest discover -s tests -p 'test_phase6_correctness_recall_v2.py'

  semantic-v5-provider-candidate-openrouter-qwen3-next-80b:
    needs:
      - infrastructure
      - historical-production-replay
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase12-eu-v5-openrouter-qwen3next80b' &&
      contains(github.event.head_commit.message, '[semantic-v5-candidate:openrouter-qwen3-next-80b]')
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout exact V5 candidate head
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Run one-shot OpenRouter Qwen3-Next 80B Event Understanding V5 qualification
        id: qualify
        continue-on-error: true
        run: python -m scripts.qualify_openrouter_qwen3next80b_v5 --report event-understanding-qualification.json
      - name: Upload bounded V5 qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-understanding-v5-openrouter-qwen3-next-80b-candidate-${{ github.run_id }}
          path: event-understanding-qualification.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail job if qualification did not pass
        if: steps.qualify.outcome != 'success'
        run: exit 1
