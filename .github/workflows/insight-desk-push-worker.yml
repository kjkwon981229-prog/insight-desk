name: Insight Desk Push Worker Deployment

on:
  push:
    branches: [main]
    paths:
      - "push-worker/**"
      - ".github/workflows/insight-desk-push-worker.yml"

permissions:
  contents: read

concurrency:
  group: insight-desk-push-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
    steps:
      - name: Checkout exact main push
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: push-worker/package-lock.json

      - name: Require Worker deployment configuration
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Cloudflare Worker deployment credentials are not configured."
            exit 1
          fi
          case "$PUSH_WORKER_URL" in
            https://*) ;;
            *)
              echo "::error::PUSH_WORKER_URL must be configured as HTTPS."
              exit 1
              ;;
          esac

      - name: Test exact Worker tree
        working-directory: push-worker
        run: npm ci && npm test && npm run deploy:dry-run

      - name: Deploy ready-only publication Worker
        working-directory: push-worker
        run: |
          npx wrangler deploy
          npx wrangler triggers deploy

      - name: Prove deployed ready-only contract
        shell: bash
        run: |
          health_file="${RUNNER_TEMP}/insight-desk-push-health.json"
          for attempt in {1..10}; do
            health_status="$(curl --silent --show-error --max-time 20 \
              --output "$health_file" \
              --write-out '%{http_code}' \
              "${PUSH_WORKER_URL%/}/health" || true)"
            if [[ "$health_status" =~ ^2[0-9][0-9]$ ]] && jq -e \
              '.publication_binding_version == 2 and .notification_policy == "publication_ready_only"' \
              "$health_file" >/dev/null 2>&1; then
              echo "PUSH_WORKER_READY_ONLY_CONTRACT_PROVEN"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Deployed Worker did not expose the ready-only publication contract."
          exit 1
