name: KBO Recall Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.head_ref == 'verify/final-live-closure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ceremonial-appearance-classification
      - name: Require exact candidate
        run: test "$(git rev-parse HEAD)" = "da21c5673b1b35122f9736e83e7b5a9a446de4d2"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Restore history
        run: |
          mkdir -p build/site/latest
          curl --fail --silent --show-error --location --max-time 15 https://kjkwon981229-prog.github.io/insight-desk/latest/data.json -o build/site/latest/data.json || rm -f build/site/latest/data.json
      - name: Build fresh live
        run: python -m insight_desk.cli --config config/topics.json --output build/site --state-file build/run-state.json --cache .cache/responses.json
      - name: Identify exact KBO recall-risk candidate
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          from insight_desk.pipeline.semantics import explicit_unclassified_event_signal

          audit = json.loads(Path('build/selection-audit.json').read_text(encoding='utf-8'))
          rows = audit.get('selection_audit', audit)
          keys = {
              row['candidate_key']: row
              for row in rows
              if row.get('topic_id') == 'kbo_hanwha'
          }
          cache = json.loads(Path('.cache/responses.json').read_text(encoding='utf-8'))
          found = {}
          def clean(value):
              return re.sub(r'<[^>]+>', '', html.unescape(str(value or ''))).strip()
          def walk(value):
              if isinstance(value, dict):
                  scalars = {str(k): v for k, v in value.items() if not isinstance(v, (dict, list))}
                  urls = {str(v) for k, v in scalars.items() if str(k).casefold() in {'link','originallink','url','canonical_url'}}
                  for key in keys:
                      if key in urls:
                          title = clean(scalars.get('title', ''))
                          description = clean(scalars.get('description', scalars.get('summary', '')))
                          found[key] = {
                              'rank': keys[key].get('topic_local_rank'),
                              'event_type': keys[key].get('event_type'),
                              'reason': keys[key].get('reason'),
                              'title': title,
                              'description': description,
                              'explicit_unclassified_event_signal': explicit_unclassified_event_signal(title),
                          }
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(cache)
          print('KBO_RECALL_DIAGNOSTIC', json.dumps(sorted(found.values(), key=lambda x: x['rank'] or 999), ensure_ascii=False, sort_keys=True))
          PY
