name: Final Live Closure Probe

on:
  pull_request:
    branches:
      - main

jobs:
  inspect-production-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read already-triggered production closure run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1fec75541d4b603b548cd5106572571603b398d3
        shell: bash
        run: |
          set -euo pipefail
          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=20"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$runs_url" > runs.json
          jq -c '{total_count, runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,run_number,run_attempt,created_at,updated_at,jobs_url,html_url}]}' runs.json
          run_id="$(jq -r '.workflow_runs[] | select(.name == "One-Shot Production Closure") | .id' runs.json | head -1)"
          test -n "$run_id"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
          jq -c --arg run_id "$run_id" '{run_id:$run_id, jobs:[.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps:[.steps[]? | {name,status,conclusion,number}]}]}' jobs.json
