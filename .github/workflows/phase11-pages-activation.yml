name: Phase 11 Pages Activation

on:
  pull_request:
    branches: [phase4-core-contracts]
    paths:
      - ".github/workflows/phase11-pages-activation.yml"
      - "ops/phase11-pages-activation-live.json"

concurrency:
  group: phase11-pages-activation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
      TOKENIZERS_PARALLELISM: "false"
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      entries: ${{ steps.state.outputs.entries }}
    steps:
      - name: Checkout verified production candidate
        uses: actions/checkout@v6
        with:
          ref: phase4-core-contracts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install acquisition and deterministic semantic runtime
        run: |
          python -m pip install --disable-pip-version-check '.[acquisition,browser,semantic-local]'
          python -m playwright install --with-deps chromium

      - name: Install local NLI runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.14.1 sentencepiece==0.2.1

      - name: Verify required provider credentials without exposing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          required = (
              "NCP_CLIENT_ID",
              "NCP_CLIENT_SECRET",
              "GROQ_API_KEY",
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("PHASE11_ACTIVATION_CREDENTIALS_MISSING:" + ",".join(missing))
          print("PHASE11_ACTIVATION_CREDENTIALS_PRESENT")
          PY

      - name: Compile production path
        run: python -m compileall -q insight_desk scripts/phase11_daily_production.py

      - name: Build verified daily briefing
        run: >-
          python scripts/phase11_daily_production.py
          --topics config/topics.json
          --output build/site
          --state build/run-state.json
          --audit build/production-audit.json

      - name: Read production state
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("build/run-state.json")
          state = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {
              "status": "TOTAL_FAILURE",
              "publish": False,
              "published_entries": 0,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"publish={'true' if state.get('publish') is True else 'false'}\n")
              output.write(f"entries={int(state.get('published_entries', 0))}\n")
          print(
              "PHASE11_ACTIVATION_STATE "
              f"status={state.get('status', 'TOTAL_FAILURE')} "
              f"publish={str(state.get('publish') is True).lower()} "
              f"entries={int(state.get('published_entries', 0))}"
          )
          PY

      - name: Fail closed when no publishable briefing exists
        if: steps.state.outputs.publish != 'true'
        run: |
          echo "::error::Activation produced no verified briefing; existing Pages deployment remains untouched."
          exit 1

      - name: Validate generated site contract
        shell: bash
        run: |
          test -s build/site/index.html
          test -s build/site/manifest.webmanifest
          test -s build/site/push-sw.js
          test -s build/site/assets/css/style.css
          test -s build/site/assets/js/push.js
          grep -q 'SUPPORTED headline + summary only' build/site/index.html
          grep -q 'manifest.webmanifest' build/site/index.html
          if grep -Eq 'key-fact-panel|next-signal|검색 관심 흐름' build/site/index.html; then
            echo "::error::Renderer manufactured an unsupported UI slot."
            exit 1
          fi

      - name: Upload activation audit
        if: always() && hashFiles('build/production-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase11-pages-activation-audit-${{ github.run_id }}
          path: |
            build/run-state.json
            build/production-audit.json
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified briefing to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
