name: Phase 11 Production Run Audit

on:
  pull_request:
    branches: [phase4-core-contracts]
    paths:
      - ".github/workflows/phase11-pages-activation.yml"
      - "ops/phase11-pages-activation-live.json"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List recent default-branch production runs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/workflows/insight-desk-production.yml/runs?branch=main&per_page=10" \
            | jq -r '.workflow_runs[] | "PHASE11_RUN id=\(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "null") head=\(.head_sha) created=\(.created_at)"'

      - name: Confirm audited Pages deployment run
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/32628855687" \
            | jq -er 'select(.status == "completed" and .conclusion == "success") | "PHASE11_PAGES_DEPLOY_CONFIRMED id=\(.id) head=\(.head_sha)"'
