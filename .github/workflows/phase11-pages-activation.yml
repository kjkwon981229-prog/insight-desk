name: Phase 11 Production Dispatch

on:
  pull_request:
    branches: [phase4-core-contracts]
    paths:
      - ".github/workflows/phase11-pages-activation.yml"
      - "ops/phase11-pages-activation-live.json"

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch default-branch production workflow
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/workflows/insight-desk-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "PHASE11_PRODUCTION_DISPATCH_ACCEPTED"

          sleep 10
          run_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/workflows/insight-desk-production.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
            | jq -r --arg started_at "$started_at" \
                '.workflow_runs | map(select(.created_at >= $started_at)) | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::Production workflow dispatch was accepted but no matching run was discoverable."
            exit 1
          fi
          echo "PHASE11_PRODUCTION_DISPATCH_RUN_ID=$run_id"
