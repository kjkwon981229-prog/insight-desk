name: Patch Ceremonial Appearance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/ceremonial-appearance-classification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/ceremonial-appearance-classification
      - name: Apply narrow ceremonial victory-context fix
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('insight_desk/pipeline/editorial.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def _is_ceremonial_appearance\(title_text: str\) -> bool:\n.*?(?=\n\ndef )',
              re.DOTALL,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one ceremonial function, found {len(matches)}')
          new = '''def _is_ceremonial_appearance(title_text: str) -> bool:\n    # A first-pitch/first-bat announcement is an entertainment appearance,\n    # not a baseball result, roster change, or meaningful game event.\n    if not any(_contains(title_text, marker) for marker in ("시구", "시타")):\n        return False\n    if any(\n        _contains(title_text, marker)\n        for marker in ("경기 결과", "패배", "홈런", "순위", "선발", "엔트리", "부상", "트레이드")\n    ):\n        return False\n    # Headlines often quote an attendee wishing for the team's victory. That is\n    # aspirational appearance copy, not evidence that a game result occurred.\n    if _contains(title_text, "승리") and not re.search(\n        r"승리(?:를)?\\s*(?:위해|기원|응원|바라|요정)", title_text\n    ):\n        return False\n    return True'''
          path.write_text(pattern.sub(lambda _match: new, text, count=1), encoding='utf-8')
          PY
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          python -m unittest tests.test_ceremonial_appearance_regression -v
      - name: Commit source patch only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- insight_desk/pipeline/editorial.py
          git diff --cached --quiet && exit 0
          git commit -m "Classify aspirational first-pitch coverage as low value"
          git push origin HEAD:fix/ceremonial-appearance-classification
