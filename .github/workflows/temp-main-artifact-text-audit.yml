name: Temporary main artifact text audit

on:
  push:
    branches:
      - fix/canonical-generation-recall-20260912
    paths:
      - ".github/workflows/temp-main-artifact-text-audit.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and verify immutable main production artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_REPOSITORY: ${{ github.repository }}
          QA_ARTIFACT_ID: "10355911207"
          QA_ZIP_SHA256: "5d31c799b27803964e51c6aaf75b3e3d7f2fcbf068ee196d3ac2fadd7a8233df"
          QA_HTML_SHA256: "749e5a02274a4dae720d4f6b777514e567402a17c9eaf8bb8921816064007abd"
        run: |
          set -euo pipefail
          qa_root="$(mktemp -d)"
          printf '%s\n' "$qa_root" > "$RUNNER_TEMP/qa-root"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$QA_REPOSITORY/actions/artifacts/$QA_ARTIFACT_ID/zip" \
            > "$qa_root/artifact.zip"
          echo "$QA_ZIP_SHA256  $qa_root/artifact.zip" | sha256sum --check -
          mkdir "$qa_root/artifact"
          unzip -q "$qa_root/artifact.zip" -d "$qa_root/artifact"
          mkdir "$qa_root/site"
          if [[ -f "$qa_root/artifact/artifact.tar" ]]; then
            tar -xf "$qa_root/artifact/artifact.tar" -C "$qa_root/site"
          else
            cp -a "$qa_root/artifact/." "$qa_root/site/"
          fi
          selected=""
          while IFS= read -r candidate; do
            candidate_sha="$(sha256sum "$candidate" | cut -d' ' -f1)"
            printf 'QA_INDEX_CANDIDATE sha256=%s path=%s\n' "$candidate_sha" "$candidate"
            if [[ "$candidate_sha" == "$QA_HTML_SHA256" ]]; then
              selected="$candidate"
            fi
          done < <(find "$qa_root/site" -type f -name index.html -print)
          test -n "$selected"
          printf '%s\n' "$selected" > "$RUNNER_TEMP/qa-index"
          echo "QA_ARTIFACT_INTEGRITY=PASS"

      - name: Emit exact visible cards and byline matches
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$(cat "$RUNNER_TEMP/qa-index")" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          class VisibleCards(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = []
                  self.current = None
                  self.depth = 0
                  self.stack = []

              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  classes = set((attr.get("class") or "").split())
                  if self.current is None and tag == "article" and "story-row" in classes:
                      self.current = {"segments": [], "links": []}
                      self.depth = 1
                      self.stack = [(tag, classes)]
                      return
                  if self.current is not None:
                      self.depth += 1
                      self.stack.append((tag, classes))
                      if tag == "a" and attr.get("href"):
                          self.current["links"].append(attr["href"])

              def handle_startendtag(self, tag, attrs):
                  if self.current is not None:
                      attr = dict(attrs)
                      if tag == "a" and attr.get("href"):
                          self.current["links"].append(attr["href"])

              def handle_data(self, data):
                  if self.current is None:
                      return
                  value = " ".join(data.split())
                  if not value:
                      return
                  tags = [tag for tag, _ in self.stack]
                  if "script" in tags or "style" in tags:
                      return
                  classes = sorted({c for _, cs in self.stack for c in cs})
                  self.current["segments"].append({
                      "tag": tags[-1] if tags else "",
                      "classes": classes,
                      "text": value,
                  })

              def handle_endtag(self, tag):
                  if self.current is None:
                      return
                  if self.stack:
                      self.stack.pop()
                  self.depth -= 1
                  if self.depth == 0:
                      self.cards.append(self.current)
                      self.current = None
                      self.stack = []

          path = Path(sys.argv[1])
          raw = path.read_text(encoding="utf-8")
          parser = VisibleCards()
          parser.feed(raw)
          assert len(parser.cards) == 4, len(parser.cards)
          pattern = re.compile(r"(?:[가-힣A-Za-z·]{2,20}\s*)?(?:기자|특파원|객원기자|인턴기자|취재기자)")
          matches = []
          for index, card in enumerate(parser.cards, 1):
              visible = " ".join(segment["text"] for segment in card["segments"])
              hits = pattern.findall(visible)
              if hits:
                  matches.append({"card": index, "hits": hits, "visible": visible})
          result = {
              "html_sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest(),
              "story_count": len(parser.cards),
              "cards": parser.cards,
              "byline_matches": matches,
          }
          print("QA_VISIBLE_CARDS=" + json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          PY
