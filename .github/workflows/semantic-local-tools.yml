name: Insight Desk Semantic Local Tools CI

on:
  pull_request:
    branches:
      - phase4-core-contracts
    paths:
      - 'pyproject.toml'
      - 'insight_desk/semantic/tooling.py'
      - 'insight_desk/semantic/kiwi_extractor.py'
      - 'insight_desk/semantic/material.py'
      - 'insight_desk/semantic/__init__.py'
      - 'tests/test_semantic_tooling_contracts.py'
      - 'tests/test_kiwi_deterministic_extractor.py'
      - 'tests/test_material_event_assessment.py'
      - 'tests/test_semantic_properties.py'
      - '.github/workflows/semantic-local-tools.yml'

permissions:
  contents: read

jobs:
  semantic-local-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install audited local semantic helpers and QA only
        run: python -m pip install --disable-pip-version-check '.[semantic-local,qa]'

      - name: Run semantic helper regressions
        run: |
          python -m unittest tests.test_semantic_tooling_contracts
          python -m unittest tests.test_kiwi_deterministic_extractor
          python -m unittest tests.test_material_event_assessment

      - name: Run property-based source-preservation QA
        run: python -m unittest tests.test_semantic_properties
