name: Final Clean Candidate Live

on:
  pull_request:
    branches: [main]

jobs:
  live:
    if: github.head_ref == 'fix/award-chart-subject-binding'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NCP_CLIENT_ID: ${{ secrets.NCP_CLIENT_ID }}
      NCP_CLIENT_SECRET: ${{ secrets.NCP_CLIENT_SECRET }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7355b736d76d728235442be74f041de6caf65698
      - name: Require exact candidate
        run: test "$(git rev-parse HEAD)" = "7355b736d76d728235442be74f041de6caf65698"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Restore public history
        shell: bash
        run: |
          mkdir -p build/site/latest
          curl --fail --silent --show-error --location --max-time 15 https://kjkwon981229-prog.github.io/insight-desk/latest/data.json -o build/site/latest/data.json || rm -f build/site/latest/data.json
      - name: Build live
        run: python -m insight_desk.cli --config config/topics.json --output build/site --state-file build/run-state.json --cache .cache/responses.json
      - name: Print diagnostics before gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build/run-state.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('build/selection-audit.json').read_text(encoding='utf-8'))
          acceptance=json.loads(Path('build/live-acceptance.json').read_text(encoding='utf-8'))
          payload=json.loads(Path('build/site/latest/data.json').read_text(encoding='utf-8'))
          print('FINAL_CLEAN_STATE', json.dumps(state,ensure_ascii=False,sort_keys=True))
          print('FINAL_CLEAN_FUNNEL', json.dumps(audit.get('funnel',{}),ensure_ascii=False,sort_keys=True))
          print('FINAL_CLEAN_ACCEPTANCE', json.dumps(acceptance,ensure_ascii=False,sort_keys=True))
          print('FINAL_CLEAN_STORIES', json.dumps(payload.get('stories',[]),ensure_ascii=False,sort_keys=True))
          reasons={'EVENT_ACTION_CONTRACT_FAILED','FACT_OWNERSHIP_UNSUPPORTED','SYNTHESIS_VETOED','RELATION_FACT_UNSUPPORTED'}
          suspects=[]
          for row in audit.get('selection_audit',[]):
              row_reasons=set(row.get('selection_reasons') or [])
              if (float(row.get('event_significance') or 0) >= 55 and not row.get('qualifying') and row_reasons.intersection(reasons)):
                  suspects.append(row)
          print('FINAL_CLEAN_SUSPECTS', json.dumps(suspects,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-clean-candidate-live-${{ github.run_id }}
          path: |
            build/run-state.json
            build/selection-audit.json
            build/live-acceptance.json
            build/site/latest/data.json
          if-no-files-found: error
      - name: Validate final candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_artifact.py build/site
          python scripts/validate_live_acceptance.py build/live-acceptance.json
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build/run-state.json').read_text(encoding='utf-8'))
          assert state['publish'] is True and state['status']=='COMPLETE', state
          assert state['news']['failed']==0, state
          audit=json.loads(Path('build/selection-audit.json').read_text(encoding='utf-8'))
          assert sum(int(v.get('strong_rejected',0) or 0) for v in audit.get('funnel',{}).values())==0, audit.get('funnel')
          acceptance=json.loads(Path('build/live-acceptance.json').read_text(encoding='utf-8'))
          assert acceptance.get('semantic_error_count',0)==0, acceptance
          payload=json.loads(Path('build/site/latest/data.json').read_text(encoding='utf-8'))
          launch=[s for s in payload.get('stories',[]) if '선정위원회 출범' in s.get('title','')]
          if launch:
              assert launch[0].get('summary') == 'KBO의 한국야구 명예의 전당 선정위원회가 출범했다.', launch[0]
          PY
