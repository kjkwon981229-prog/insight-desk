name: Phase 5 Acquisition Runtime Canary

on:
  push:
    branches:
      - phase5-acquisition-runtime-canary
  pull_request:
    branches:
      - phase4-core-contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install acquisition runtimes
        run: python -m pip install -e '.[acquisition,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run controlled acquisition runtime canary
        run: python scripts/phase5_runtime_canary.py
