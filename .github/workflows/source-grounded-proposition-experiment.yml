name: Source-grounded Proposition Authority Experiment

on:
  pull_request:
    paths:
      - 'insight_desk/evidence_first_event_compilation_v1.py'
      - 'scripts/run_evidence_first_event_experiment_v1.py'
      - 'scripts/run_source_grounded_proposition_experiment_v1.py'
      - 'tests/test_evidence_first_event_compilation_v1.py'
      - '.github/workflows/source-grounded-proposition-experiment.yml'

permissions:
  contents: read

jobs:
  frozen-proposition-experiment:
    if: github.event.pull_request.head.ref == 'experiment/source-grounded-proposition-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Install deterministic semantic runtime
        run: python -m pip install --disable-pip-version-check '.[semantic-local]'
      - name: Run inherited evidence-first contract tests
        run: python -m unittest discover -s tests -p 'test_evidence_first_event_compilation_v1.py'
      - name: Run frozen source-grounded proposition comparison
        id: experiment
        continue-on-error: true
        run: python -m scripts.run_source_grounded_proposition_experiment_v1 --report source-grounded-proposition-experiment-v1.json
      - name: Upload proposition experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-grounded-proposition-experiment-v1
          path: source-grounded-proposition-experiment-v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce automatic experiment verdict
        if: steps.experiment.outcome == 'failure'
        run: exit 1
